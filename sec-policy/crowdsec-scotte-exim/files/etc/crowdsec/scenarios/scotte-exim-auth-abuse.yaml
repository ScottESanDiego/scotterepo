type: leaky
name: scotte/exim-smtp-auth-bf
description: "Detect repeated Exim SMTP AUTH failures from one IP"
filter: "evt.Meta.service == 'exim' && evt.Meta.log_type == 'exim_failed_auth'"
groupby: evt.Meta.source_ip
capacity: 1
leakspeed: "10m"
blackhole: 10m
labels:
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1110
  behavior: "smtp:bruteforce"
  label: "Exim SMTP AUTH bruteforce"
  remediation: true
  service: smtp
